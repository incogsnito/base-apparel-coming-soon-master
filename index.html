<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <main class="container">


      <div class="sub__container">


        <div class="logo">
          <img
            src="./base-apparel-coming-soon-master/images/logo.svg"
            alt="logo"
          />
        </div>



        <div class="wrapper">

          <div class="img__wrapper">

            <img
              class="lady"
              src="./base-apparel-coming-soon-master/images/hero-mobile.jpg"
              alt=""
            />

          </div>

          <article class="info">

            <h2><span>We're</span> coming soon</h2>

            <p>
              Hello fellow shoppers! We're currently building our new fashion
              store. Add your email below to stay up-to-date with announcements
              and our launch deals.
            </p>
            <form class="form__container" novalidate id="form">
              <label for="email"></label>
              <input id="email" type="email" autocomplete="email" placeholder="Email Address" required />
              <div class="error" id="error">
              <img src="./base-apparel-coming-soon-master/images/icon-error.svg" alt=""></div>
              <button type="submit" id="btn">
                <img
                  src="./base-apparel-coming-soon-master/images/icon-arrow.svg"
                  alt=""
                />
              </button>
            </form>
          </article>
          <p class="invalid" id ='invalid'></p>
        </div>
      </div>

        <div class="desktop-wrap">
          <img
            class="lady-desktop"
            src="./base-apparel-coming-soon-master/images/hero-desktop.jpg"
            alt=""
          />
        </div>
      
    </main>
    <script src="script.js"></script>
  </body>
</html>
