<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <main class="container">
      <div class="logo">
        <img
          src="./base-apparel-coming-soon-master/images/logo.svg"
          alt="logo"
        />
      </div>

      <img
        src="./base-apparel-coming-soon-master/images/hero-mobile.jpg"
        alt=""
      />
      <article class="info">
      <h2><span>We're</span> coming soon</h2>

      <p>
        Hello fellow shoppers! We're currently building our new fashion store.
        Add your email below to stay up-to-date with announcements and our
        launch deals.
      </p>
      </article>

      <form class="form__container" action="#">
        <label for="email"></label>
        <input type="email" placeholder="Email Address" >
        <button type="submit" id="btn"> <img src="./base-apparel-coming-soon-master/images/icon-arrow.svg" alt=""></button>
      </form>
    </main>
    <script src="script.js"></script>
  </body>
</html>
